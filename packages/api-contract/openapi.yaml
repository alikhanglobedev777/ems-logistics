components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Page:
      in: query
      name: page
      schema:
        type: integer
        minimum: 1
        default: 1
    Limit:
      in: query
      name: limit
      schema:
        type: integer
        minimum: 1
        maximum: 200
    UserId:
      in: path
      name: userId
      required: true
      schema:
        type: integer
        minimum: 1
    RoleId:
      in: path
      name: roleId
      required: true
      schema:
        type: integer
        minimum: 1
    Search:
      in: query
      name: search
      schema: { type: string }
    IsActive:
      in: query
      name: isActive
      schema: { type: boolean }
    StationId:
      in: query
      name: stationId
      schema: { type: integer, minimum: 1 }
    VehicleTypeIdQuery:
      in: query
      name: vehicleTypeId
      schema: { type: integer, minimum: 1 }
    VehicleStatus:
      in: query
      name: status
      schema:
        type: string
        enum: [available, assigned, in_transit, maintenance, breakdown, inactive]
    VehicleTypeId:
      in: path
      name: vehicleTypeId
      required: true
      schema: { type: integer, minimum: 1 }
    VehicleId:
      in: path
      name: vehicleId
      required: true
      schema: { type: integer, minimum: 1 }
    DriverId:
      in: path
      name: driverId
      required: true
      schema: { type: integer, minimum: 1 }
    AssignmentId:
      in: path
      name: assignmentId
      required: true
      schema: { type: integer, minimum: 1 }
    CustomerId:
      in: path
      name: customerId
      required: true
      schema: { type: integer, minimum: 1 }
    AgentId:
      in: path
      name: agentId
      required: true
      schema: { type: integer, minimum: 1 }

  schemas:
    AuthRegisterRequest:
      type: object
      required:
        - name
        - email
        - password
      properties:
        name:
          type: string
          example: Ali Khan
        email:
          type: string
          format: email
          example: admin@ems.local
        phone:
          type: string
          nullable: true
          example: "03001234567"
        password:
          type: string
          minLength: 8
          example: StrongPass123
        roleName:
          type: string
          description: Customer for public registration. super_admin/admin are only allowed for the first setup user.
          enum: [customer, super_admin, admin]

    AuthLoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: admin@ems.local
        password:
          type: string
          example: StrongPass123

    RefreshTokenRequest:
      type: object
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string

    CurrentUser:
      type: object
      required:
        - id
        - name
        - email
        - role
        - permissions
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Ali Khan
        email:
          type: string
          format: email
          example: admin@ems.local
        phone:
          type: string
          nullable: true
        role:
          type: string
          example: admin
        roleLabel:
          type: string
          example: Customer
        permissions:
          type: array
          items:
            type: string
          example: ["booking.create", "trip.dispatch"]

    AuthResponse:
      type: object
      required:
        - data
        - message
      properties:
        data:
          type: object
          required:
            - accessToken
            - refreshToken
            - user
          properties:
            accessToken:
              type: string
            refreshToken:
              type: string
            user:
              $ref: "#/components/schemas/CurrentUser"
        message:
          type: string
          example: Success

    MeResponse:
      type: object
      required:
        - data
        - message
      properties:
        data:
          $ref: "#/components/schemas/CurrentUser"
        message:
          type: string
          example: Success

    RoleSummary:
      type: object
      required: [id, name, label]
      properties:
        id:
          type: integer
        name:
          type: string
        label:
          type: string

    Permission:
      type: object
      required: [id, key, label, groupName, createdAt]
      properties:
        id:
          type: integer
        key:
          type: string
          example: user.manage
        label:
          type: string
          example: Manage
        groupName:
          type: string
          example: User
        createdAt:
          type: string
          format: date-time

    Role:
      type: object
      required: [id, name, label, isSystem, permissions, createdAt, updatedAt]
      properties:
        id:
          type: integer
        name:
          type: string
          example: operations_manager
        label:
          type: string
          example: Operations Manager
        isSystem:
          type: boolean
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/Permission"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    User:
