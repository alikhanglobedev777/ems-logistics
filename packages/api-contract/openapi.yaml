      properties:
        name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
          nullable: true
        password:
          type: string
          minLength: 8
        roleId:
          type: integer
          minimum: 1
        isActive:
          type: boolean

    UpdateUserRequest:
      type: object
