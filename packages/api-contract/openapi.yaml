openapi: 3.0.3

info:
  title: EMS Logistics API
  version: 1.0.0
  description: Contract-first OpenAPI specification for EMS Logistics System.
  license:
    name: Proprietary
    url: https://ems-logistics.local/license

servers:
  - url: /api
    description: Local and deployed API base path

tags:
  - name: Health
    description: API health and status endpoints
  - name: Stations
    description: Station and branch management

paths:
  /health:
    get:
      tags:
        - Health
      operationId: getHealth
      summary: Health check
      security: []
      responses:
        "200":
          description: API is running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    HealthResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          required:
            - status
            - service
            - timestamp
          properties:
            status:
              type: string
              example: ok
            service:
              type: string
              example: ems-api
            timestamp:
              type: string
              format: date-time

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              example: BAD_REQUEST
            message:
              type: string
              example: Invalid request
            details:
              type: array
              items:
                type: string

security:
  - bearerAuth: []