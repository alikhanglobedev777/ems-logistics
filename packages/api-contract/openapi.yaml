openapi: 3.0.3

info:
  title: EMS Logistics API
  version: 1.0.0
  description: Contract-first OpenAPI specification for EMS Logistics System.
  license:
    name: Proprietary
    url: https://ems-logistics.local/license

servers:
  - url: /api
    description: Local and deployed API base path

tags:
  - name: Auth
    description: Authentication and current user endpoints
  - name: Users
    description: User administration
  - name: Roles
    description: Role administration
  - name: Permissions
    description: Permission catalogue
  - name: Health
    description: API health and status endpoints
  - name: Cities
    description: City management
  - name: Stations
    description: Station and branch management
  - name: Vehicle Types
    description: Vehicle classification master data
  - name: Vehicles
    description: Fleet master data
  - name: Drivers
    description: Driver master data
  - name: Driver Vehicle Assignments
    description: Primary and temporary driver assignments
  - name: Customers
    description: Contracted and spot customer master data
  - name: Agents
    description: Booking agent master data
  - name: Routes
    description: Operational route setup
  - name: Fuel Price Snapshots
    description: Fuel price snapshots used for stable historical pricing
  - name: Route Fuel Profiles
    description: Expected route fuel by vehicle type
  - name: Route Overhead Profiles
    description: Internal hidden overhead by route and vehicle type
  - name: Pricing
    description: Internal route pricing estimate APIs

paths:
  /auth/register:
    post:
      tags:
        - Auth
      operationId: register
      summary: Register a user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthRegisterRequest"
      responses:
        "201":
          description: User registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Duplicate email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/login:
    post:
      tags:
        - Auth
      operationId: login
      summary: Login user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthLoginRequest"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/me:
    get:
      tags:
        - Auth
      operationId: getMe
      summary: Get current authenticated user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/refresh:
    post:
      tags:
        - Auth
      operationId: refreshAuth
      summary: Rotate a refresh session and issue new tokens
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
      responses:
        "200":
          description: Tokens refreshed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid or expired refresh token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      tags:
        - Auth
      operationId: logout
      summary: Revoke a refresh session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
      responses:
        "200":
          description: Session revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /users:
    get:
      tags:
        - Users
      operationId: getUsers
      summary: List users
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Paginated users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsersListResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Permission denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      tags:
        - Users
      operationId: createUser
      summary: Create a managed user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Duplicate email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /users/{userId}:
    parameters:
      - $ref: "#/components/parameters/UserId"
    get:
      tags:
        - Users
      operationId: getUserById
      summary: Get a user
      responses:
        "200":
          description: User detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      tags:
        - Users
      operationId: updateUser
      summary: Update a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: User updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /users/{userId}/status:
    patch:
      tags:
        - Users
      operationId: updateUserStatus
      summary: Activate or deactivate a user
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserStatusRequest"
      responses:
        "200":
          description: User status updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /roles:
    get:
      tags:
        - Roles
      operationId: getRoles
      summary: List roles
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Paginated roles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RolesListResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      tags:
        - Roles
      operationId: createRole
      summary: Create a role and assign permissions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRoleRequest"
      responses:
        "201":
          description: Role created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /roles/{roleId}:
    parameters:
      - $ref: "#/components/parameters/RoleId"
    get:
      tags:
        - Roles
      operationId: getRoleById
      summary: Get a role
      responses:
        "200":
          description: Role detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleResponse"
        "404":
          description: Role not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      tags:
        - Roles
      operationId: updateRole
      summary: Update a role and its permissions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRoleRequest"
      responses:
        "200":
          description: Role updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /permissions:
    get:
      tags:
        - Permissions
      operationId: getPermissions
      summary: List available permissions
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Paginated permissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PermissionsListResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /health:
    get:
      tags:
        - Health
      operationId: getHealth
      summary: Health check
      security: []
      responses:
        "200":
          description: API is running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /cities:
    get:
      tags:
        - Cities
      operationId: getCities
      summary: Get cities list
      responses:
        "200":
          description: Cities list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CitiesListResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    post:
      tags:
        - Cities
      operationId: createCity
      summary: Create city
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCityRequest"
      responses:
        "201":
          description: City created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CityResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /stations:
    get:
      tags:
        - Stations
      operationId: getStations
      summary: Get stations list
      parameters:
        - in: query
          name: cityId
          schema:
            type: integer
        - in: query
          name: isActive
          schema:
            type: boolean
      responses:
        "200":
          description: Stations list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StationsListResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    post:
      tags:
        - Stations
      operationId: createStation
      summary: Create station
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStationRequest"
      responses:
        "201":
          description: Station created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StationResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /stations/{stationId}:
    get:
      tags:
        - Stations
      operationId: getStationById
      summary: Get station by ID
      parameters:
        - in: path
          name: stationId
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Station detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StationResponse"
        "404":
          description: Station not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    patch:
      tags:
        - Stations
      operationId: updateStation
      summary: Update station
      parameters:
        - in: path
          name: stationId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateStationRequest"
      responses:
        "200":
          description: Station updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StationResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Station not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /vehicle-types:
    get:
      tags: [Vehicle Types]
      operationId: getVehicleTypes
      summary: List vehicle types
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/IsActive"
      responses:
        "200": { description: Vehicle types, content: { application/json: { schema: { $ref: "#/components/schemas/VehicleTypesListResponse" } } } }
        "401": { description: Unauthorized, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
    post:
      tags: [Vehicle Types]
      operationId: createVehicleType
      summary: Create vehicle type
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CreateVehicleTypeRequest" } } } }
      responses:
        "201": { description: Vehicle type created, content: { application/json: { schema: { $ref: "#/components/schemas/VehicleTypeResponse" } } } }
        "400": { description: Invalid request, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }

  /vehicle-types/{vehicleTypeId}:
    parameters: [{ $ref: "#/components/parameters/VehicleTypeId" }]
    get:
      tags: [Vehicle Types]
      operationId: getVehicleTypeById
      summary: Get vehicle type
      responses:
        "200": { description: Vehicle type, content: { application/json: { schema: { $ref: "#/components/schemas/VehicleTypeResponse" } } } }
        "404": { description: Not found, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
    patch:
      tags: [Vehicle Types]
      operationId: updateVehicleType
      summary: Update vehicle type
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/UpdateVehicleTypeRequest" } } } }
      responses:
        "200": { description: Vehicle type updated, content: { application/json: { schema: { $ref: "#/components/schemas/VehicleTypeResponse" } } } }
        "400": { description: Invalid request, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
    delete:
      tags: [Vehicle Types]
      operationId: deleteVehicleType
      summary: Soft delete vehicle type
      responses:
        "200": { description: Vehicle type deactivated, content: { application/json: { schema: { $ref: "#/components/schemas/VehicleTypeResponse" } } } }
        "404": { description: Not found, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }

  /vehicles:
    get:
      tags: [Vehicles]
      operationId: getVehicles
      summary: List vehicles
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/IsActive"
        - $ref: "#/components/parameters/StationId"
        - $ref: "#/components/parameters/VehicleTypeIdQuery"
        - $ref: "#/components/parameters/VehicleStatus"
      responses:
        "200": { description: Vehicles, content: { application/json: { schema: { $ref: "#/components/schemas/VehiclesListResponse" } } } }
        "401": { description: Unauthorized, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
    post:
      tags: [Vehicles]
      operationId: createVehicle
      summary: Create vehicle
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CreateVehicleRequest" } } } }
      responses:
        "201": { description: Vehicle created, content: { application/json: { schema: { $ref: "#/components/schemas/VehicleResponse" } } } }
        "400": { description: Invalid request, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }

  /vehicles/{vehicleId}:
    parameters: [{ $ref: "#/components/parameters/VehicleId" }]
    get:
      tags: [Vehicles]
      operationId: getVehicleById
      summary: Get vehicle
      responses:
        "200": { description: Vehicle, content: { application/json: { schema: { $ref: "#/components/schemas/VehicleResponse" } } } }
        "404": { description: Not found, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
    patch:
      tags: [Vehicles]
      operationId: updateVehicle
      summary: Update vehicle
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/UpdateVehicleRequest" } } } }
      responses:
        "200": { description: Vehicle updated, content: { application/json: { schema: { $ref: "#/components/schemas/VehicleResponse" } } } }
        "400": { description: Invalid request, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
    delete:
      tags: [Vehicles]
      operationId: deleteVehicle
      summary: Soft delete vehicle
      responses:
        "200": { description: Vehicle deactivated, content: { application/json: { schema: { $ref: "#/components/schemas/VehicleResponse" } } } }
        "404": { description: Not found, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }

  /drivers:
    get:
      tags: [Drivers]
      operationId: getDrivers
      summary: List drivers
      parameters: [{ $ref: "#/components/parameters/Page" }, { $ref: "#/components/parameters/Limit" }, { $ref: "#/components/parameters/Search" }, { $ref: "#/components/parameters/IsActive" }]
      responses:
        "200": { description: Drivers, content: { application/json: { schema: { $ref: "#/components/schemas/DriversListResponse" } } } }
        "401": { description: Unauthorized, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
    post:
      tags: [Drivers]
      operationId: createDriver
      summary: Create driver
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CreateDriverRequest" } } } }
      responses:
        "201": { description: Driver created, content: { application/json: { schema: { $ref: "#/components/schemas/DriverResponse" } } } }
        "400": { description: Invalid request, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }

  /drivers/{driverId}:
    parameters: [{ $ref: "#/components/parameters/DriverId" }]
    get:
      tags: [Drivers]
      operationId: getDriverById
      summary: Get driver
      responses:
        "200": { description: Driver, content: { application/json: { schema: { $ref: "#/components/schemas/DriverResponse" } } } }
        "404": { description: Not found, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
    patch:
      tags: [Drivers]
      operationId: updateDriver
      summary: Update driver
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/UpdateDriverRequest" } } } }
      responses:
        "200": { description: Driver updated, content: { application/json: { schema: { $ref: "#/components/schemas/DriverResponse" } } } }
        "400": { description: Invalid request, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
    delete:
      tags: [Drivers]
      operationId: deleteDriver
      summary: Soft delete driver
      responses:
        "200": { description: Driver deactivated, content: { application/json: { schema: { $ref: "#/components/schemas/DriverResponse" } } } }
        "404": { description: Not found, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }

  /driver-vehicle-assignments:
    get:
      tags: [Driver Vehicle Assignments]
      operationId: getDriverVehicleAssignments
      summary: List driver vehicle assignments
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/IsActive"
        - { in: query, name: driverId, schema: { type: integer } }
        - { in: query, name: vehicleId, schema: { type: integer } }
        - { in: query, name: assignmentType, schema: { $ref: "#/components/schemas/DriverAssignmentType" } }
      responses:
        "200": { description: Assignments, content: { application/json: { schema: { $ref: "#/components/schemas/DriverVehicleAssignmentsListResponse" } } } }
        "401": { description: Unauthorized, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
    post:
      tags: [Driver Vehicle Assignments]
      operationId: createDriverVehicleAssignment
      summary: Assign driver to vehicle
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CreateDriverVehicleAssignmentRequest" } } } }
      responses:
        "201": { description: Assignment created, content: { application/json: { schema: { $ref: "#/components/schemas/DriverVehicleAssignmentResponse" } } } }
        "400": { description: Invalid assignment, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }

  /driver-vehicle-assignments/{assignmentId}:
    parameters: [{ $ref: "#/components/parameters/AssignmentId" }]
    get:
      tags: [Driver Vehicle Assignments]
      operationId: getDriverVehicleAssignmentById
      summary: Get assignment
      responses:
        "200": { description: Assignment, content: { application/json: { schema: { $ref: "#/components/schemas/DriverVehicleAssignmentResponse" } } } }
        "404": { description: Not found, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
    patch:
      tags: [Driver Vehicle Assignments]
      operationId: updateDriverVehicleAssignment
      summary: Update assignment
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/UpdateDriverVehicleAssignmentRequest" } } } }
      responses:
        "200": { description: Assignment updated, content: { application/json: { schema: { $ref: "#/components/schemas/DriverVehicleAssignmentResponse" } } } }
        "400": { description: Invalid assignment, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
    delete:
      tags: [Driver Vehicle Assignments]
      operationId: deleteDriverVehicleAssignment
      summary: End assignment
      responses:
        "200": { description: Assignment ended, content: { application/json: { schema: { $ref: "#/components/schemas/DriverVehicleAssignmentResponse" } } } }
        "404": { description: Not found, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }

  /customers:
    get:
      tags: [Customers]
      operationId: getCustomers
      summary: List customers
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/IsActive"
        - { in: query, name: customerType, schema: { $ref: "#/components/schemas/CustomerType" } }
      responses:
        "200": { description: Customers, content: { application/json: { schema: { $ref: "#/components/schemas/CustomersListResponse" } } } }
        "401": { description: Unauthorized, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
    post:
      tags: [Customers]
      operationId: createCustomer
      summary: Create customer
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CreateCustomerRequest" } } } }
      responses:
        "201": { description: Customer created, content: { application/json: { schema: { $ref: "#/components/schemas/CustomerResponse" } } } }
