components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Page:
      in: query
      name: page
      schema:
        type: integer
        minimum: 1
        default: 1
    Limit:
      in: query
      name: limit
      schema:
        type: integer
        minimum: 1
        maximum: 200
    UserId:
      in: path
      name: userId
      required: true
      schema:
        type: integer
        minimum: 1
    RoleId:
      in: path
      name: roleId
      required: true
      schema:
        type: integer
        minimum: 1
    Search:
      in: query
      name: search
      schema: { type: string }
    IsActive:
      in: query
      name: isActive
      schema: { type: boolean }
    StationId:
      in: query
      name: stationId
      schema: { type: integer, minimum: 1 }
    VehicleTypeIdQuery:
      in: query
      name: vehicleTypeId
      schema: { type: integer, minimum: 1 }
    VehicleStatus:
      in: query
      name: status
      schema:
        type: string
        enum: [available, assigned, in_transit, maintenance, breakdown, inactive]
    VehicleTypeId:
      in: path
      name: vehicleTypeId
      required: true
      schema: { type: integer, minimum: 1 }
    VehicleId:
      in: path
      name: vehicleId
      required: true
      schema: { type: integer, minimum: 1 }
    DriverId:
      in: path
      name: driverId
      required: true
      schema: { type: integer, minimum: 1 }
    AssignmentId:
      in: path
      name: assignmentId
      required: true
      schema: { type: integer, minimum: 1 }
    CustomerId:
      in: path
      name: customerId
      required: true
      schema: { type: integer, minimum: 1 }
    AgentId:
      in: path
      name: agentId
      required: true
      schema: { type: integer, minimum: 1 }

  schemas:
    AuthRegisterRequest:
      type: object
      required:
        - name
        - email
        - password
      properties:
        name:
          type: string
          example: Ali Khan
        email:
          type: string
          format: email
          example: admin@ems.local
        phone:
          type: string
          nullable: true
          example: "03001234567"
        password:
          type: string
          minLength: 8
          example: StrongPass123
        roleName:
          type: string
          description: Customer for public registration. super_admin/admin are only allowed for the first setup user.
          enum: [customer, super_admin, admin]

    AuthLoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: admin@ems.local
        password:
          type: string
          example: StrongPass123

    RefreshTokenRequest:
      type: object
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string

    CurrentUser:
      type: object
      required:
        - id
        - name
        - email
        - role
        - permissions
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Ali Khan
        email:
          type: string
          format: email
          example: admin@ems.local
        phone:
          type: string
          nullable: true
        role:
          type: string
          example: admin
        roleLabel:
          type: string
          example: Customer
        permissions:
          type: array
          items:
            type: string
          example: ["booking.create", "trip.dispatch"]

    AuthResponse:
      type: object
      required:
        - data
        - message
      properties:
        data:
          type: object
          required:
            - accessToken
            - refreshToken
            - user
          properties:
            accessToken:
              type: string
            refreshToken:
              type: string
            user:
              $ref: "#/components/schemas/CurrentUser"
        message:
          type: string
          example: Success

    MeResponse:
      type: object
      required:
        - data
        - message
      properties:
        data:
          $ref: "#/components/schemas/CurrentUser"
        message:
          type: string
          example: Success

    RoleSummary:
      type: object
      required: [id, name, label]
      properties:
        id:
          type: integer
        name:
          type: string
        label:
          type: string

    Permission:
      type: object
      required: [id, key, label, groupName, createdAt]
      properties:
        id:
          type: integer
        key:
          type: string
          example: user.manage
        label:
          type: string
          example: Manage
        groupName:
          type: string
          example: User
        createdAt:
          type: string
          format: date-time

    Role:
      type: object
      required: [id, name, label, isSystem, permissions, createdAt, updatedAt]
      properties:
        id:
          type: integer
        name:
          type: string
          example: operations_manager
        label:
          type: string
          example: Operations Manager
        isSystem:
          type: boolean
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/Permission"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    User:
      type: object
      required: [id, name, email, isActive, role, createdAt, updatedAt]
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
          nullable: true
        isActive:
          type: boolean
        role:
          $ref: "#/components/schemas/RoleSummary"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateUserRequest:
      type: object
      required: [name, email, password, roleId]
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
          nullable: true
        password:
          type: string
          minLength: 8
        roleId:
          type: integer
          minimum: 1
        isActive:
          type: boolean

    UpdateUserRequest:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
          nullable: true
        password:
          type: string
          minLength: 8
        roleId:
          type: integer
          minimum: 1
        isActive:
          type: boolean

    UpdateUserStatusRequest:
      type: object
      required: [isActive]
      properties:
        isActive:
          type: boolean

    CreateRoleRequest:
      type: object
      required: [name, label]
      properties:
        name:
          type: string
          pattern: "^[a-z][a-z0-9_]*$"
        label:
          type: string
        permissionKeys:
          type: array
          uniqueItems: true
          items:
            type: string

    UpdateRoleRequest:
      type: object
      properties:
        name:
          type: string
          pattern: "^[a-z][a-z0-9_]*$"
        label:
          type: string
        permissionKeys:
          type: array
          uniqueItems: true
          items:
            type: string

    Pagination:
      type: object
      required: [page, limit, total, totalPages]
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer

    UserResponse:
      type: object
      required: [data, message]
      properties:
        data:
          $ref: "#/components/schemas/User"
        message:
          type: string
          example: Success

    UsersListResponse:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/User"
        pagination:
          $ref: "#/components/schemas/Pagination"

    RoleResponse:
      type: object
      required: [data, message]
      properties:
        data:
          $ref: "#/components/schemas/Role"
        message:
          type: string
          example: Success

    RolesListResponse:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Role"
        pagination:
          $ref: "#/components/schemas/Pagination"

    PermissionsListResponse:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Permission"
        pagination:
          $ref: "#/components/schemas/Pagination"

    SuccessResponse:
      type: object
      required: [data, message]
      properties:
        data:
          type: object
          nullable: true
        message:
          type: string
          example: Success

    HealthResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          required:
            - status
            - service
            - timestamp
          properties:
            status:
              type: string
              example: ok
            service:
              type: string
              example: ems-api
            timestamp:
              type: string
              format: date-time

    City:
      type: object
      required:
        - id
        - name
        - country
        - createdAt
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Lahore
        province:
          type: string
          nullable: true
          example: Punjab
        country:
          type: string
          example: Pakistan
        createdAt:
          type: string
          format: date-time

    CreateCityRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          example: Lahore
        province:
          type: string
          nullable: true
          example: Punjab
        country:
          type: string
          example: Pakistan

    CityResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/City"

    CitiesListResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/City"

    Station:
      type: object
      required:
        - id
        - cityId
        - cityName
        - name
        - isActive
        - createdAt
      properties:
        id:
          type: integer
          example: 1
        cityId:
          type: integer
          example: 1
        cityName:
          type: string
          example: Lahore
        name:
          type: string
          example: Lahore Main Station
        code:
          type: string
          nullable: true
          example: LHR-MAIN
        address:
          type: string
          nullable: true
        contactPhone:
          type: string
          nullable: true
          example: "03001234567"
        isActive:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time

    CreateStationRequest:
      type: object
      required:
        - cityId
        - name
      properties:
        cityId:
          type: integer
        name:
          type: string
        code:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
        contactPhone:
          type: string
          nullable: true

    UpdateStationRequest:
      type: object
      properties:
        cityId:
          type: integer
        name:
          type: string
        code:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
        contactPhone:
          type: string
          nullable: true
        isActive:
